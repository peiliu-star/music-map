<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>非遺音樂地理誌 MVP</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    #map-loading {
      font-family: "Microsoft JhengHei", sans-serif;
      padding: 24px;
      text-align: center;
      color: #666;
    }
    .popup-content {
      text-align: center;
      font-family: "Songti TC", "宋體-繁", "STSong", "PMingLiU", "MingLiU", "SimSun", "宋体", "Noto Serif TC", serif;
    }
     .popup-content h3 {
      margin: 0 0 8px 0;
      color: #333;
      font-weight: normal;   /* 楷體通常只有一種字重，避免被瀏覽器強行加粗變糊 */
      font-family: "Kaiti TC", "楷體-繁", "BiauKai", "標楷體", "DFKai-SB", "Kaiti SC", "KaiTi", "楷体", "STKaiti", "Noto Serif TC", serif;
    }
    .popup-content p {
      margin: 0 0 12px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #666;
    }
    .popup-content img {
      width: 220px;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      margin: 0 auto 8px;
      background: #eee;
    }
    .popup-content audio {
      width: 220px;
      outline: none;
    }
  </style>
</head>

<body style="margin: 0;">
 <div id="map"></div>

  <script>
     var playingAudio = null;
    document.addEventListener('play', function (event) {
       if (playingAudio && playingAudio !== event.target) {
        playingAudio.pause();
      }

      document.querySelectorAll('audio').forEach(function (player) {
        if (player !== event.target) {
          player.pause();
        }
      });

       playingAudio = event.target;
    }, true);

     if (typeof L === 'undefined') {
      document.getElementById('map').innerHTML =
        '<p id="map-loading">地圖元件載入失敗，請檢查網路連線後重新整理。</p>';
    } else {
      var map = L.map('map').setView([23.5, 117.5], 6);

   L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}', {
  subdomains: '1234',
  attribution: '&copy; 高德地圖',
  maxZoom: 18
}).addTo(map);

map.on('popupclose', function () {
        if (playingAudio) {
          playingAudio.pause();
          playingAudio = null;
        }
      });

    var musicData = [
        {
        id: "macau-01",
        title: "澳門鹹水歌",
        description: "水上人家的傳統漁歌，反映珠江三角洲的曲調語法。",
        lat: 22.1987,
        lng: 113.5439,
        image: "./assets/img/macau.jpg",
        audioUrl: "./assets/luoyuge.mp3" 
      },
      {
        id: "taiwan-01",
        title: "台灣客家山歌",
        description: "反映丘陵地形與客家勞動生活的即興歌唱。",
        lat: 24.5815,
        lng: 121.0026,
        image: "./assets/img/taiwan-hakka.jpg",
        audioUrl: "./assets/laushange_HSU.mp3" 
      },
      {
        id: "guangxi",
        title: "廣西山歌",
        description: "反映廣西傳統非遺音樂。",
        lat: 22.82,
        lng: 108.32,
        image: "./assets/img/guangxi.jpg",
        audioUrl: "./assets/guangxizhuangzu.mp3" 
      },
      {
        id: "hunan",
        title: "湖南山歌",
        description: "流傳於湖南耒陽一帶的民間歌曲，歌詞多取自日常生活。",
        lat: 26.41,
        lng: 112.85,
        image: "./assets/img/hunan.jpg",
        audioUrl: "./assets/hunanleiyang.mp3" 
      },
      {
        id: "shanxi",
        title: "陝西山歌",
        description: "陕北黄河岸边的民歌，以走西口題材與高亢曲調著稱。",
        lat: 38.29,
        lng: 109.47,
        image: "./assets/img/zouxikou.jpeg",
        audioUrl: "./assets/zouxikou.mp3" 
      },
      {
        id: "zangzu",
        title: "藏族川藏族山歌",
        description: "藏族山歌音域寬廣、節奏自由，常在高原勞動與放牧時演唱。",
        lat: 29.65,
        lng:91.11,
        image: "./assets/img/tibetan.jpg",
        audioUrl: "./assets/zangzuchuanzangzushange.mp3" 
      },
      {
        id: "haixi",
        title: "海西民歌",
        description: "根植鄉土煙火，融入日常歲月，以質樸鮮活的姿態，續寫綿延不絕的文化傳奇。",
        lat: 37.37,
        lng: 97.37,
        image: "./assets/img/haixi.jpg",
        audioUrl: "./assets/haixi.mp3" 
      },
    ];
function wgs84ToGcj02(lng, lat) {
      const a = 6378245.0, ee = 0.00669342162296594323;

      function outOfChina(lng, lat) {
        return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
      }
      function transformLat(x, y) {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      }
      function transformLng(x, y) {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      }

      if (outOfChina(lng, lat)) {
        return [lng, lat];
      }

      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lng + dLng, lat + dLat];
    }
    musicData.forEach(function (item) {
        const g = wgs84ToGcj02(item.lng, item.lat);
        const gLng = g[0];
        const gLat = g[1];

        const popupHTML = `
        <div class="popup-content">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          <img src="${item.image}" alt="${item.title}"> 
          <audio controls controlsList="nodownload">
            <source src="${item.audioUrl}">
            你的瀏覽器不支援音訊播放。
          </audio>
        </div>
      `;
      L.marker([gLat, gLng]).addTo(map).bindPopup(popupHTML);
    });
    }
  </script>
</body>
</html>
